# Orquestacion local: MySQL + API de operacion. El front corre aparte con `npm run dev`
# (Vite reenvia /api y /ws a 127.0.0.1:3000).
#   cp .env.example .env && docker compose up --build
services:
  mysql:
    image: mysql:8.0.40
    container_name: paqtracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./paqtracker-infra/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - paqtracker-red
    healthcheck:
      # Ping por TCP: durante la primera inicializacion MySQL levanta un servidor temporal solo por
      # socket; un ping por socket lo daria por sano antes de que la API pueda conectarse.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: paqtracker-api/Dockerfile
    image: paqtracker-api:0.6.0
    container_name: paqtracker-api
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_DATOS_VENTAS: /app/datos/ventas.v20260909
      APP_DATOS_BLOQUEOS: /app/datos/bloqueos.v20260909
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - paqtracker-red

volumes:
  mysql_data:

networks:
  paqtracker-red:
    name: paqtracker-red
