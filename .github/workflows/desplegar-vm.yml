name: Desplegar en VM PUCP

on:
  workflow_dispatch:

concurrency:
  group: desplegar-vm
  cancel-in-progress: false

jobs:
  desplegar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar la API
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl paqtracker-api -am package -DskipTests

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: paqtracker-web/package-lock.json

      - name: Compilar la web
        working-directory: paqtracker-web
        env:
          VITE_API_BASE_URL: /api
          VITE_WS_URL: /ws
        run: |
          npm ci
          npm run build

      - name: Configurar SSH hacia la VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$VM_HOST" "$VM_USER" > ~/.ssh/config
          ssh vm "echo Conexion con la VM OK"

      - name: Actualizar el repo en la VM
        run: |
          PREV=$(ssh vm 'cat ~/.paqtracker-commit-desplegado 2>/dev/null || git -C /opt/paqrap/repo rev-parse HEAD')
          echo "Ultimo commit desplegado: $PREV"
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          ssh vm "cd /opt/paqrap/repo && git fetch -q origin main && git merge --ff-only ${{ github.sha }} && rm -rf paqtracker-web/dist && mkdir -p paqtracker-api/target"

      - name: Subir la API y la web compiladas
        run: |
          scp paqtracker-api/target/paqtracker-api.jar vm:/opt/paqrap/repo/paqtracker-api/target/
          scp -r paqtracker-web/dist vm:/opt/paqrap/repo/paqtracker-web/

      - name: Desplegar
        run: ssh vm "sudo -n /usr/local/bin/paqtracker-desplegar $PREV"

      - name: Registrar el commit desplegado
        run: ssh vm "echo ${{ github.sha }} > ~/.paqtracker-commit-desplegado"

      - name: Verificar el sitio
        run: |
          curl -fsS -o /dev/null -w "Sitio responde: %{http_code}\n" "https://$VM_HOST/"
