services:
  mysql:
    image: mysql:8.0
    container_name: paqtracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paqtracker}
      MYSQL_USER: ${MYSQL_USER:-paq_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-paq_pass_2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - paqtracker-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local

networks:
  paqtracker-net:
    name: paqtracker-net
    driver: bridge
