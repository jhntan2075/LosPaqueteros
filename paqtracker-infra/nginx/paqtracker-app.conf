# Directivas de PaqTracker para incluir dentro de un bloque server que ya existe (por ejemplo, el server
# 443 que gestiona certbot en la VM de la PUCP): sirven la SPA y reenvian /api y /ws a la API, que escucha
# solo en 127.0.0.1:3000. No declara server, listen ni el root del server: no choca con los sitios ya
# activos. Instalar en /etc/nginx/snippets/paqtracker-app.conf y, dentro del server, escribir:
#   include /etc/nginx/snippets/paqtracker-app.conf;
# Para una maquina sin otros sitios (AWS) se usa paqtracker.conf, que trae su propio server.

# Archivos de ventas y bloqueos que se suben (CU-02); igual a APP_MAX_ARCHIVO de la API.
client_max_body_size 20m;

# Recursos con hash de Vite: se pueden guardar en cache sin riesgo. El root va en cada location para no
# depender del root del server que incluye el snippet.
location /assets/ {
    root /var/www/paqtracker;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# SPA: cualquier ruta del front cae en index.html. Las location mas largas del server (como /tomcat/)
# siguen teniendo prioridad sobre esta.
location / {
    root /var/www/paqtracker;
    index index.html;
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El registro de un pedido replanifica de inmediato; se deja margen para el Ta.
    proxy_read_timeout 120s;
}

# STOMP sobre WebSocket: conexiones largas, una por visualizador conectado.
location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
