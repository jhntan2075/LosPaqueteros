# Configuracion de pruebas, superpuesta a application.yml: H2 en memoria en modo MySQL, sin datos reales.
# arranca sola para que cada prueba controle sus ejecuciones; los datos son fixtures versionados.
spring:
  datasource:
    url: jdbc:h2:mem:paqtracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migracion

paqtracker:
  datos:
    ventas: tests-resources/datos/ventas
    bloqueos: tests-resources/datos/bloqueos
  ejecucion:
    dia-a-dia-activo: false
