# Configuracion de pruebas: H2 en memoria en modo MySQL, sin datos reales.
spring:
  datasource:
    url: jdbc:h2:mem:paqtracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migracion
